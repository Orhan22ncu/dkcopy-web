<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 344 120">
  <defs>
    <!-- Yol tanımları tek yerde; katmanlar use ile çoğaltır (fill sınıflardan gelir) -->
    <path id="p1" d="M80.5,63.8c0,13.1-10.6,23.7-23.7,23.7s-23.7-10.6-23.7-23.7,10.6-23.7,23.7-23.7,23.7,10.6,23.7,23.7Z"/>
    <path id="p2" d="M178.4,120h-27.8l-21.4-37.1-21.4,37.1h-9.3l30.7-53.1,26,45.1h9.3l-30.7-53.1,29.4-50.8h-9.3l-48.4,83.8h0c-9.7,16.8-27.9,28.1-48.7,28.1-31.1,0-56.2-25.2-56.2-56.2S25.8,7.5,56.8,7.5s4.8.2,7.1.4v8.3c-2.3-.3-4.7-.5-7.1-.5-26.5,0-48,21.5-48,48s21.5,48.2,48,48.2c12.3,0,24.7-4.7,34.1-14.1,3.1-3.1,5.6-6.4,7.7-10h0C98.7,87.7,149.3,0,149.3,0h27.8l-34,58.9,35.3,61.1h0Z"/>
    <path id="p3" d="M56.8,23.6c5.5,0,10.7,1.1,15.4,3.1V0h8.3v42.3c-5.8-6.4-14.3-10.5-23.7-10.5-17.6,0-31.9,14.3-31.9,31.9s14.3,31.9,31.9,31.9,31.9-14.3,31.9-31.9V0h24.3v46.7l-8,13.9V8h-8v55.7c0,9.2-3.1,17.7-8.3,24.4-7.3,9.6-18.9,15.8-31.9,15.8-22.2,0-40.2-18-40.2-40.2S34.6,23.6,56.8,23.6Z"/>
    <path id="p4" d="M201.7,47.2c-7,0-12.4,5.4-12.4,12.5s5.4,12.6,12.4,12.6,7.7-1.9,10.6-4.8l5.4,5.9c-4.3,4.4-10.5,7.3-16.5,7.3-12.2,0-21.4-9-21.4-20.9s9.4-20.6,21.7-20.6,12.1,2.6,16.1,6.8l-5.4,6.5c-2.8-3.2-6.8-5.3-10.6-5.3h0Z"/>
    <path id="p5" d="M263.4,59.9c0,11.8-9.4,20.8-21.9,20.8s-21.9-9-21.9-20.8,9.4-20.7,21.9-20.7,21.9,8.9,21.9,20.7ZM229,59.9c0,7.2,5.8,12.8,12.6,12.8s12.4-5.6,12.4-12.8-5.5-12.6-12.4-12.6-12.6,5.5-12.6,12.6Z"/>
    <path id="p6" d="M303,53.7c0,9.5-5.9,15-16.3,15h-8.1v11.7h-9.2v-40.8h17.3c10.4,0,16.3,5.1,16.3,14.2h0ZM294.3,54c0-4.5-2.9-6.8-8-6.8h-7.6v13.8h7.6c5.1,0,8-2.3,8-7h0Z"/>
    <path id="p7" d="M328.6,67.2v13.2h-9.2v-12.9l-15.1-27.9h9.3l10.4,18.3,10.2-18.3h9.3l-14.9,27.6Z"/>
    <clipPath id="logoClip">
      <use href="#p1"/><use href="#p2"/><use href="#p3"/>
      <use href="#p4"/><use href="#p5"/><use href="#p6"/><use href="#p7"/>
    </clipPath>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF3D6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/>
    </linearGradient>
    <filter id="haloBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { fill: #C89B3C; animation: monoFlash 6s ease-in-out infinite; }
      .yazi { fill: #F8F5EE; animation: yaziFlash 6s ease-in-out infinite; }
      .halo { fill: #FFD98A; opacity: 0; animation: haloFlash 6s ease-in-out infinite; }
      .sweep { animation: sweepMove 6s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sweepMove {
        0% { transform: translateX(-180px); }
        20%, 100% { transform: translateX(520px); }
      }
      @keyframes haloFlash {
        0%, 24% { opacity: 0; }
        33%, 40% { opacity: .9; }
        54%, 100% { opacity: 0; }
      }
      @keyframes monoFlash {
        0%, 24% { fill: #C89B3C; }
        33%, 40% { fill: #FFE3A6; }
        54%, 100% { fill: #C89B3C; }
      }
      @keyframes yaziFlash {
        0%, 24% { fill: #F8F5EE; }
        33%, 40% { fill: #FFFFFF; }
        54%, 100% { fill: #F8F5EE; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mono, .yazi, .halo, .sweep { animation: none; }
        .halo { opacity: 0; }
      }
    </style>
  </defs>
  <!-- Katman 1: parlama halesi (blur kopya, çoğu zaman görünmez) -->
  <g class="halo" filter="url(#haloBlur)">
    <use href="#p1"/><use href="#p2"/><use href="#p3"/>
    <use href="#p4"/><use href="#p5"/><use href="#p6"/><use href="#p7"/>
  </g>
  <!-- Katman 2: logonun kendisi -->
  <g class="mono"><use href="#p1"/><use href="#p2"/><use href="#p3"/></g>
  <g class="yazi"><use href="#p4"/><use href="#p5"/><use href="#p6"/><use href="#p7"/></g>
  <!-- Katman 3: çizgilerde dolaşan ışık (logo şekliyle kırpılmış bant) -->
  <g clip-path="url(#logoClip)">
    <g transform="skewX(-12)">
      <rect class="sweep" x="0" y="-10" width="80" height="140" fill="url(#sweepGrad)"/>
    </g>
  </g>
</svg>
